{% block extrastyle %}

<style>
    :root, [data-theme="light"], [data-theme="dark"], [data-theme="auto"] {

        content: "" !important;

<!-- AUDIO CORREGIDO A MP3 -->
<audio id="hk-ambient" loop autoplay>
    <source src="{% static 'sounds/Hollow Knight OST - Title Theme.mp3' %}" type="audio/mpeg">
</audio>

<audio id="hk-click-sound" preload="auto">
    <source src="{% static 'sounds/ui_button_confirm.mp3' %}" type="audio/mpeg">
</audio>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const ambientMusic = document.getElementById('hk-ambient');
        const confirmSound = document.getElementById('hk-click-sound');
        
        ambientMusic.volume = 0.18;
        confirmSound.volume = 0.8;

        const savedTime = sessionStorage.getItem('hk_audio_time');
        const isPlaying = sessionStorage.getItem('hk_audio_playing');

        if (savedTime) {
            ambientMusic.currentTime = parseFloat(savedTime);
        }

        if (isPlaying === 'true') {
            ambientMusic.play().catch(() => {});
        }

        // Burlar el bloqueo de autoplay en el admin también
        document.body.addEventListener('click', function() {
            if (ambientMusic.paused) {
                ambientMusic.play().catch(() => {});
                sessionStorage.setItem('hk_audio_playing', 'true');
            }
        }, { once: true });

        window.addEventListener('beforeunload', function() {
            sessionStorage.setItem('hk_audio_time', ambientMusic.currentTime);
            sessionStorage.setItem('hk_audio_playing', !ambientMusic.paused);
        });

        document.addEventListener('mousedown', function(e) {
            const target = e.target.closest('a, button, input[type="submit"], input[type="button"], .addlink, .changelink, .deletelink');
            if (target) {
                confirmSound.currentTime = 0;
                confirmSound.play().catch(() => {});
            }
        });
    });
</script>
