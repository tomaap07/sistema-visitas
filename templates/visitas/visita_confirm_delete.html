{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Confirmar Eliminación</h4>
            </div>
            <div class="card-body text-center">
                <h5 class="mb-4">¿Estás seguro que deseas eliminar el registro de <strong>{{ object.nombre_completo }}</strong>?</h5>
                <p class="text-muted">Esta acción no se puede deshacer.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <a href="{% url 'visita_list' %}" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Sí, eliminar registro</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
