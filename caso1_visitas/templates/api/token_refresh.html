{% extends "visita/base.html" %}
{% block title %}Actualizar token · Hallow Agenda{% endblock %}
{% block content %}
<section class="api-page api-narrow"><a class="back-link" href="{% url 'api_home' %}">← Volver a la API</a><div class="panel api-panel"><p class="eyebrow">POST /api/token/refresh/</p><h2>Actualizar token</h2>
<form id="refresh-form" class="api-form">{% csrf_token %}<div class="field"><label for="refresh">Refresh token</label><textarea id="refresh" name="refresh" required rows="5" class="field-input"></textarea></div><button class="button">Actualizar access token ↗</button></form>
<div id="refresh-result" class="api-result" aria-live="polite" hidden></div></div></section>
<script>
document.querySelector("#refresh-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const result = document.querySelector("#refresh-result");
  const values = Object.fromEntries(new FormData(event.target));
  delete values.csrfmiddlewaretoken;
  try {
    const response = await fetch("{% url 'token_refresh' %}", {method: "POST", headers: {"Content-Type": "application/json", "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value}, body: JSON.stringify(values)});
    const data = await response.json();
    result.textContent = response.ok ? `Access: ${data.access}` : "El refresh token no es válido o ya expiró.";
  } catch (_) { result.textContent = "No se pudo conectar. Intenta nuevamente."; }
  result.hidden = false;
});
</script>
{% endblock %}
