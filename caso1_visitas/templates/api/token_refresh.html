{% extends "visita/base.html" %}

{% block title %}Actualizar token | Recepción{% endblock %}

{% block content %}
<section class="mx-auto max-w-2xl" aria-labelledby="refresh-title">
    <a href="{% url 'api_home' %}" class="text-sm font-bold text-orange-800 hover:text-orange-950">← Volver a la API</a>
    <div class="mt-7 border border-orange-100 bg-white/90 p-7 shadow-[10px_10px_0_rgba(251,146,60,0.13)] sm:p-10">
        <p class="text-xs font-bold uppercase tracking-[0.2em] text-orange-700">POST /api/token/refresh/</p>
        <h1 id="refresh-title" class="mt-3 text-4xl font-black text-stone-950">Actualizar token</h1>
        <form id="refresh-form" class="mt-8 space-y-5">
            {% csrf_token %}
            <div><label for="refresh" class="mb-2 block text-sm font-semibold">Refresh token</label><textarea id="refresh" name="refresh" required rows="5" class="w-full rounded-xl border border-orange-200 px-3 py-2.5 font-mono text-sm outline-none focus:border-orange-600 focus:ring-4 focus:ring-orange-100"></textarea></div>
            <button class="w-full rounded-xl bg-orange-700 px-5 py-3 text-sm font-semibold text-white transition hover:bg-orange-800">Actualizar access token</button>
        </form>
        <div id="refresh-result" class="mt-6 hidden rounded-xl border border-orange-200 bg-orange-50 p-4 text-sm" aria-live="polite"></div>
    </div>
</section>
<script>
document.querySelector("#refresh-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const result = document.querySelector("#refresh-result");
    const values = Object.fromEntries(new FormData(event.target));
    delete values.csrfmiddlewaretoken;
    const response = await fetch("{% url 'token_refresh' %}", {method: "POST", headers: {"Content-Type": "application/json", "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value}, body: JSON.stringify(values)});
    const data = await response.json();
    result.textContent = response.ok ? `Access: ${data.access}` : "El refresh token no es válido o ya expiró.";
    result.classList.remove("hidden");
});
</script>
{% endblock %}
