{% extends "visita/base.html" %}
{% block title %}Obtener token · Hallow Agenda{% endblock %}
{% block content %}
<section class="api-page api-narrow"><a class="back-link" href="{% url 'api_home' %}">← Volver a la API</a><div class="panel api-panel"><p class="eyebrow">POST /api/token/</p><h2>Obtener token JWT</h2>
<form id="token-form" class="api-form">{% csrf_token %}<div class="field"><label for="username">Usuario</label><input id="username" name="username" required autocomplete="username" class="field-input"></div><div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" required autocomplete="current-password" class="field-input"></div><button class="button">Solicitar tokens ↗</button></form>
<div id="token-result" class="api-result" aria-live="polite" hidden></div></div></section>
<script>
document.querySelector("#token-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const result = document.querySelector("#token-result");
  const values = Object.fromEntries(new FormData(event.target));
  delete values.csrfmiddlewaretoken;
  try {
    const response = await fetch("{% url 'token_obtain_pair' %}", {method: "POST", headers: {"Content-Type": "application/json", "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value}, body: JSON.stringify(values)});
    const data = await response.json();
    result.textContent = response.ok ? `Access: ${data.access} | Refresh: ${data.refresh}` : "No se pudieron obtener los tokens. Revisa tus credenciales.";
  } catch (_) { result.textContent = "No se pudo conectar. Intenta nuevamente."; }
  result.hidden = false;
});
</script>
{% endblock %}
