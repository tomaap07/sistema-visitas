{% extends "visita/base.html" %}

{% block title %}Obtener token | Recepción{% endblock %}

{% block content %}
<section class="mx-auto max-w-2xl" aria-labelledby="token-title">
    <a href="{% url 'api_home' %}" class="text-sm font-bold text-orange-800 hover:text-orange-950">← Volver a la API</a>
    <div class="mt-7 border border-orange-100 bg-white/90 p-7 shadow-[10px_10px_0_rgba(251,146,60,0.13)] sm:p-10">
        <p class="text-xs font-bold uppercase tracking-[0.2em] text-orange-700">POST /api/token/</p>
        <h1 id="token-title" class="mt-3 text-4xl font-black text-stone-950">Obtener token JWT</h1>
        <form id="token-form" class="mt-8 space-y-5">
            {% csrf_token %}
            <div><label for="username" class="mb-2 block text-sm font-semibold">Usuario</label><input id="username" name="username" required autocomplete="username" class="w-full rounded-xl border border-orange-200 px-3 py-2.5 outline-none focus:border-orange-600 focus:ring-4 focus:ring-orange-100"></div>
            <div><label for="password" class="mb-2 block text-sm font-semibold">Contraseña</label><input id="password" name="password" type="password" required autocomplete="current-password" class="w-full rounded-xl border border-orange-200 px-3 py-2.5 outline-none focus:border-orange-600 focus:ring-4 focus:ring-orange-100"></div>
            <button class="w-full rounded-xl bg-orange-700 px-5 py-3 text-sm font-semibold text-white transition hover:bg-orange-800">Solicitar tokens</button>
        </form>
        <div id="token-result" class="mt-6 hidden rounded-xl border border-orange-200 bg-orange-50 p-4 text-sm" aria-live="polite"></div>
    </div>
</section>
<script>
document.querySelector("#token-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const result = document.querySelector("#token-result");
    const values = Object.fromEntries(new FormData(event.target));
    delete values.csrfmiddlewaretoken;
    const response = await fetch("{% url 'token_obtain_pair' %}", {method: "POST", headers: {"Content-Type": "application/json", "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value}, body: JSON.stringify(values)});
    const data = await response.json();
    result.textContent = response.ok ? `Access: ${data.access} | Refresh: ${data.refresh}` : "No se pudieron obtener los tokens. Revisa tus credenciales.";
    result.classList.remove("hidden");
});
</script>
{% endblock %}
