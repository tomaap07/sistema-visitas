{% extends "visita/base.html" %}

{% block title %}Autenticación API | Recepción{% endblock %}

{% block content %}
<section class="mx-auto max-w-3xl" aria-labelledby="auth-title">
    <a href="{% url 'api_home' %}" class="text-sm font-bold text-orange-800 hover:text-orange-950">← Volver a la API</a>
    <div class="mt-7 border border-orange-100 bg-white/90 p-7 shadow-[10px_10px_0_rgba(251,146,60,0.13)] sm:p-10">
        <p class="text-xs font-bold uppercase tracking-[0.2em] text-orange-700">/api/auth/</p>
        <h1 id="auth-title" class="mt-3 text-4xl font-black text-stone-950">Autenticación</h1>
        <p class="mt-4 leading-7 text-stone-600">Usa la sesión de Django REST Framework para navegar los recursos protegidos.</p>
        <div class="mt-8 flex flex-wrap gap-3">
            <a href="/api/auth/login/?next=/api/" class="rounded-xl bg-orange-700 px-5 py-3 text-sm font-semibold text-white transition hover:bg-orange-800">Iniciar sesión</a>
            <a href="/api/auth/logout/?next=/api/auth/" class="rounded-xl border border-orange-200 px-5 py-3 text-sm font-semibold text-orange-800 transition hover:bg-orange-50">Cerrar sesión</a>
        </div>
    </div>
</section>
{% endblock %}
